name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: Node.js Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Build project
        run: npm run build

      - name: Run unit & integration tests
        run: npm test

  nix:
    name: Nix Flake Check & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            fallback = true
            substituters = https://cache.nixos.org
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=

      - name: Check Nix flake outputs and modules
        run: nix flake check --fallback

      - name: Build default package
        run: nix build --fallback

  publish:
    name: Publish to npm
    needs: [test, nix]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 with npm registry
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Publish new version if updated
        run: |
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          NPM_VERSION=$(npm view gone-to-plaid version 2>/dev/null || echo "0.0.0")
          echo "Local version:        $LOCAL_VERSION"
          echo "npm registry version: $NPM_VERSION"

          if [ "$LOCAL_VERSION" != "$NPM_VERSION" ]; then
            if [ -n "$NODE_AUTH_TOKEN" ]; then
              echo "Publishing gone-to-plaid@$LOCAL_VERSION to npm..."
              npm publish --access public --provenance
            else
              echo "Error: NPM_TOKEN secret is not set in repository secrets. Skipping publish."
              exit 1
            fi
          else
            echo "Version $LOCAL_VERSION is already published on npm. Nothing to do."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
